name: Build desktop packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            python -m pip install secretstorage
          fi

      - name: Build application directory
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            python -m PyInstaller --noconfirm --clean --onedir --console \
              --name easystartermc --collect-all keyring --copy-metadata keyring \
              --collect-all secretstorage --collect-all jeepney \
              --copy-metadata secretstorage mc_tui.py
          else
            python -m PyInstaller --noconfirm --clean --onedir --console \
              --name easystartermc --collect-all keyring --copy-metadata keyring \
              mc_tui.py
          fi

      - name: Create Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/easystartermc -DestinationPath dist/easystartermc-${{ matrix.target }}.zip -Force

      - name: Create Linux archive
        if: runner.os == 'Linux'
        run: tar -czf dist/easystartermc-${{ matrix.target }}.tar.gz -C dist easystartermc

      - name: Create macOS installer package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p pkgroot/usr/local/lib/easystartermc pkgroot/usr/local/bin
          cp -R dist/easystartermc/. pkgroot/usr/local/lib/easystartermc/
          ln -s /usr/local/lib/easystartermc/easystartermc pkgroot/usr/local/bin/easystartermc
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            package_version="${GITHUB_REF_NAME#v}"
          else
            package_version="1.0.${GITHUB_RUN_NUMBER}"
          fi
          pkgbuild --root pkgroot --identifier org.easystartermc.launcher \
            --version "$package_version" --install-location / \
            dist/easystartermc-${{ matrix.target }}.pkg

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: easystartermc-${{ matrix.target }}
          path: dist/easystartermc-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
